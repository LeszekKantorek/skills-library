name: Close linked issues

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  pull-requests: read
  issues: write

jobs:
  close-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Use only trusted inline code; never check out or execute the PR branch.
      - name: Close issues linked to the pull request
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import urllib.request

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              event = json.load(source)
          repo = event["repository"]["full_name"]
          owner, name = repo.split("/")
          number = event["pull_request"]["number"]

          def request(url, payload, method="POST"):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode(),
                  method=method,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.load(response)
              if result.get("errors"):
                  raise RuntimeError("GitHub GraphQL request failed")
              return result

          query = """
          query($owner: String!, $name: String!, $number: Int!, $cursor: String) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                state
                closingIssuesReferences(first: 100, after: $cursor) {
                  nodes { number state repository { nameWithOwner } }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }
          }
          """
          cursor = None
          targets = set()
          while True:
              result = request(os.environ["GITHUB_GRAPHQL_URL"], {
                  "query": query,
                  "variables": {"owner": owner, "name": name, "number": number, "cursor": cursor},
              })
              pr = result["data"]["repository"]["pullRequest"]
              if pr["state"] == "OPEN":
                  raise RuntimeError("Pull request was reopened; refusing to close issues")
              linked = pr["closingIssuesReferences"]
              for issue in linked["nodes"]:
                  if issue["repository"]["nameWithOwner"].lower() != repo.lower():
                      print("Skipping an issue from another repository")
                      continue
                  if issue["state"] == "OPEN":
                      targets.add(int(issue["number"]))
              if not linked["pageInfo"]["hasNextPage"]:
                  break
              cursor = linked["pageInfo"]["endCursor"]

          reason = "completed" if event["pull_request"]["merged"] else "not_planned"
          for issue_number in sorted(targets):
              request(
                  os.environ["GITHUB_API_URL"] + "/repos/" + repo + "/issues/" + str(issue_number),
                  {"state": "closed", "state_reason": reason},
                  method="PATCH",
              )
              print("Closed issue #" + str(issue_number))
          print("Closed " + str(len(targets)) + " linked issue(s)")
