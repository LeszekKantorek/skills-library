name: Import skill
description: Request review and import of one or more skills.
title: "Import: "
body:
  - type: textarea
    id: links
    attributes:
      label: Skill links
      description: One link per line. Prefer a specific skill directory and source version.
      placeholder: https://github.com/owner/repo/tree/main/skills/skill-name
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Use case and notes
      description: Optionally describe the use case, preferred name, or known limitations.
